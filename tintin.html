<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      font-size: 16px;
      line-height: 1.4;
      background-color: #877360;
      margin: 0;
      padding: 0 8px 30px;
      color: #000;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    /* ===== HEADER (header.js uses these classes) ===== */
    #header {
      background-image: url("https://img.magnific.com/free-vector/abstract-grainy-background_474888-6925.jpg?semt=ais_hybrid&w=740&q=80");
      background-size: 100% 100%;
      background-repeat: no-repeat;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .header-s {
      display: flex;
      justify-content: space-between;
    }

    .header-s a {
      color: #F5E9C8;
      font-family: "Courier New", monospace;
      text-decoration: none;
      text-shadow: 1px 1px 0 #000;
    }

    .header-s a:hover {
      color: #FFF073;
      text-decoration: underline;
    }

    .title a {
      color: #FFF073;
      text-decoration: none;
      text-shadow: 1px 1px 0 #000;
    }

    .subtitle a {
      color: #F5E9C8;
      font-family: "Courier New", monospace;
      text-decoration: none;
      text-shadow: 1px 1px 0 #000;
    }

    /* ===== MAIN BOX ===== */
    .content-container {
      border: 3px ridge #5A3825;
      background-color: #EBE4E4;
      padding: 20px 24px 28px;
      margin-top: 20px;
      text-align: left;
    }

    .content-container a:link    { color: #0000EE; text-decoration: underline; }
    .content-container a:visited { color: #551A8B; }
    .content-container a:hover   { color: #CC0000; }

    h1 {
      color: #5A3825;
      font-size: 30px;
      font-weight: normal;
      margin: 14px 0 6px;
    }

    .back {
      font-family: "Courier New", monospace;
      font-size: 0.85em;
      margin: 0;
    }

    hr {
      border: 0;
      border-top: 1px solid #5A3825;
      margin: 16px 0 22px;
    }

    /* ===== BOOK GRID: 5 per row ===== */
    .shelf {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 16px;
    }

    /* each box = one book, and the whole box is a link to its PDF */
    .content-container a.book {
      display: block;
      aspect-ratio: 3 / 4;
      background: #fff;
      border: 3px solid #000;
      overflow: hidden;
      text-decoration: none;
    }

    .content-container a.book:hover,
    .content-container a.book:focus-visible {
      border-color: #5A3825;
      box-shadow: 4px 4px 0 #877360;
      outline: none;
    }

    .book img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ===== PDF VIEWER (dark overlay) ===== */
    #viewer {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
    }

    #viewer.open { display: flex; }

    .viewer-panel {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 900px;
      height: 100%;
      background: #EBE4E4;
      border: 3px ridge #5A3825;
    }

    .viewer-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 10px;
      background: #5A3825;
      color: #F5E9C8;
      font-family: "Courier New", monospace;
      font-size: 0.9em;
    }

    .viewer-bar span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .viewer-links {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .viewer-bar a {
      color: #FFF073;
    }

    .viewer-bar a:hover {
      color: #fff;
    }

    .viewer-bar button {
      font-family: inherit;
      font-size: inherit;
      background: transparent;
      color: #F5E9C8;
      border: 1px solid #F5E9C8;
      padding: 2px 10px;
      cursor: pointer;
    }

    .viewer-bar button:hover {
      background: brown;
      color: #fff;
    }

    #viewer-frame {
      flex: 1;
      width: 100%;
      border: 0;
      background: #fff;
    }

    @media (max-width: 640px) {
      .shelf { grid-template-columns: repeat(3, 1fr); gap: 12px; }
    }

    @media (max-width: 400px) {
      .shelf { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>

  <!-- PDF viewer: click outside the page, press Esc, or use the close button to leave -->
  <div id="viewer" role="dialog" aria-label="Comic viewer">
    <div class="viewer-panel">
      <div class="viewer-bar">
        <span id="viewer-title"></span>
        <div class="viewer-links">
          <a id="viewer-open" href="#" target="_blank" rel="noopener">open in new tab</a>
          <button type="button" id="viewer-close">close &#10005;</button>
        </div>
      </div>
      <iframe id="viewer-frame" title="Comic PDF" src="about:blank"></iframe>
    </div>
  </div>

  <script>
    const viewer = document.getElementById("viewer");
    const frame = document.getElementById("viewer-frame");
    const viewerTitle = document.getElementById("viewer-title");
    const viewerOpen = document.getElementById("viewer-open");

    // phones/tablets and some browsers can't show a PDF inside a page,
    // so for them the cover opens the PDF in a new tab instead
    const canEmbedPdf =
      navigator.pdfViewerEnabled !== false &&
      !window.matchMedia("(pointer: coarse)").matches;

    function openViewer(url, title) {
      frame.src = url + "#view=FitH";
      viewerTitle.textContent = title;
      viewerOpen.href = url;
      viewer.classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeViewer() {
      viewer.classList.remove("open");
      frame.src = "about:blank";
      document.body.style.overflow = "";
    }

    // hide the broken-image icon so a missing cover stays a plain white box
    document.querySelectorAll(".book img").forEach((img) => {
      img.addEventListener("error", () => { img.style.visibility = "hidden"; });
    });

    document.querySelectorAll("a.book").forEach((link) => {
      link.addEventListener("click", (e) => {
        if (link.classList.contains("nopop")) return;   // normal link
        e.preventDefault();

        if (!canEmbedPdf) {
          window.open(link.href, "_blank");
          return;
        }
        openViewer(link.getAttribute("href"), link.title);
      });
    });

    document.getElementById("viewer-close").addEventListener("click", closeViewer);

    // clicking the dark area around the page closes it
    viewer.addEventListener("click", (e) => {
      if (e.target === viewer) closeViewer();
    });

    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && viewer.classList.contains("open")) closeViewer();
    });
  </script>
