<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://i.pinimg.com/736x/25/65/d1/2565d1c3b2f7141bfdcdca78154656e8.jpg" type="image/jpeg">
  <title>egon.td</title>

  <style>
    body {
      font-family: "Times New Roman", Times, serif;
      background-image: url("https://static.vecteezy.com/system/resources/previews/024/763/523/non_2x/volleyball-illustration-on-blue-background-yellow-and-white-color-with-blue-outline-seamless-pattern-hand-drawn-doodle-art-for-wallpaper-wrapping-paper-backdrop-fabric-sport-icon-vector.jpg");
      margin: 0;
      padding: 0 8px 30px;
      color: white;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 4px;
      margin: 28px 0 10px;
    }

    .buttons img {
      width: 88px;
      height: 31px;
      border: 0;
      image-rendering: pixelated;
    }

    /* ===== HEADER (header.js uses these classes) ===== */
    #header {
      background-image: url("https://img.magnific.com/free-vector/abstract-grainy-background_474888-6925.jpg?semt=ais_hybrid&w=740&q=80");
      background-size: 100% 100%;
      background-repeat: no-repeat;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    .title a {
      color: #FFF073;
      text-decoration: none;
    }

    .subtitle a {
      color: grey;
      font-family: "Courier New", monospace;
      text-decoration: none;
    }

    /* ===== MAIN BOX ===== */
    .content-container {
      border: 1px solid grey;
      background-color: #000000;
      padding: 20px;
      margin-top: 20px;
      text-align: left;
    }

    /* ===== POSTS ===== */
    .post {
      margin-bottom: 8px;
      padding-bottom: 18px;
      border-bottom: 1px solid #444;
      scroll-margin-top: 20px;
    }

    .post:last-child {
      border-bottom: 0;
    }

    .post-title {
      margin: 18px 0 4px;
      font-size: 1.4em;
      font-weight: normal;
      color: #FFF073;
    }

    .post-date {
      font-family: "Courier New", monospace;
      font-size: 0.8em;
      color: grey;
      margin-bottom: 12px;
    }

    .post-text {
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .post-images {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
    }

    .post-images img {
      max-width: 100%;
      max-height: 420px;
      width: auto;
      height: auto;
      border: 1px solid #444;
      cursor: zoom-in;
    }

    .post-admin {
      margin-top: 10px;
    }

    #status {
      font-family: "Courier New", monospace;
      font-size: 0.9em;
      color: grey;
    }

    /* ===== ADMIN ===== */
    #admin-panel {
      margin-bottom: 18px;
    }

    #admin-panel input[type="text"],
    #admin-panel textarea {
      display: block;
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 8px;
      padding: 8px 10px;
      font-family: "Times New Roman", Times, serif;
      font-size: 1em;
      color: white;
      background: #111;
      border: 1px solid grey;
    }

    #admin-panel textarea {
      min-height: 200px;
      resize: vertical;
      line-height: 1.5;
    }

    #admin-panel input:focus,
    #admin-panel textarea:focus {
      outline: none;
      border-color: white;
    }

    #edit-note {
      display: none;
      font-family: "Courier New", monospace;
      font-size: 0.85em;
      color: #FFF073;
      margin-bottom: 8px;
    }

    /* photo picker + previews */
    #preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0;
    }

    .thumb {
      position: relative;
    }

    .thumb img {
      display: block;
      height: 80px;
      width: auto;
      border: 1px solid grey;
    }

    .thumb button {
      position: absolute;
      top: 2px;
      right: 2px;
      margin: 0;
      padding: 0 5px;
      line-height: 1.3;
      background: rgba(0, 0, 0, 0.75);
    }

    #photo-info {
      font-family: "Courier New", monospace;
      font-size: 0.8em;
      color: grey;
      margin-bottom: 8px;
    }

    /* message shown under the Publish button */
    #admin-msg {
      font-family: "Courier New", monospace;
      font-size: 0.85em;
      margin-top: 10px;
      min-height: 1.2em;
      color: grey;
    }

    #admin-msg.err { color: #ff8a8a; }
    #admin-msg.ok  { color: #8fdc8f; }

    button {
      margin: 4px 6px 0 0;
      padding: 4px 12px;
      font-family: "Times New Roman", Times, serif;
      background: transparent;
      color: white;
      border: 1px solid grey;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: brown;
      border-color: brown;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    hr {
      border: 0;
      border-top: 1px solid grey;
      margin: 14px 0;
    }

    /* ===== PHOTO VIEWER (dark overlay) ===== */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 10;
      align-items: center;
      justify-content: center;
      padding: 16px;
      box-sizing: border-box;
      cursor: pointer;
    }

    #lightbox.open { display: flex; }

    #lightbox img {
      max-width: 100%;
      max-height: 95vh;
    }
  </style>
</head>

<body>

  <div class="container">

    <div id="site-header"></div>
    <script src="header.js"></script>

    <div class="content-container">
      <div class="buttons">
        <a href="https://discord.gg/nxQ6ww2W8"><img src="discord2.gif" width="88" height="31" alt="VolleyballSource Discord"></a>

      </div>
      <!-- ADMIN PANEL (only shown when you are signed in) -->
      <div id="admin-panel" style="display:none;">
        <div id="edit-note">editing a post</div>
        <input type="text" id="postTitle" placeholder="Title">
        <textarea id="postText" placeholder="Write your post..."></textarea>

        <button type="button" id="addPhotoBtn">Add photos</button>
        <input type="file" id="photoInput" accept="image/*" multiple hidden>
        <div id="preview"></div>
        <div id="photo-info"></div>

        <button id="saveBtn" onclick="savePost()">Publish</button>
        <button id="cancelBtn" onclick="cancelEdit()" style="display:none;">Cancel</button>
        <div id="admin-msg" role="status" aria-live="polite"></div>
        <hr>
      </div>

      <div id="status"></div>
      <div id="posts"></div>

    </div>

  </div>

  <!-- click a photo in a post to enlarge it; click anywhere or press Esc to close -->
  <div id="lightbox"><img id="lightbox-img" alt=""></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";

import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  updateDoc,
  deleteDoc,
  doc,
  query,
  orderBy
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD7JjchLZ7qcwbBk1BMmYtAPqNrcQcJevA",
  authDomain: "egontd-b9357.firebaseapp.com",
  projectId: "egontd-b9357",
  storageBucket: "egontd-b9357.appspot.com",
  messagingSenderId: "241512022087",
  appId: "1:241512022087:web:0ad7a133f1d146fdc4b162"
};

const ADMIN_UID = "9l4WslIGuJZz5M9v5Bxi2MyNgWC3";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const col = collection(db, "posts");

/* Firestore allows about 1 MB per post, so photos are shrunk and the
   whole post (text + photos) is kept under this many characters */
const LIMIT = 900000;
const GIF_MAX_BYTES = 400 * 1024; // small GIFs keep their animation

let isAdmin = false;
let editingId = null;
let pendingImages = [];   // photos for the post being written/edited

const titleInput = document.getElementById("postTitle");
const textInput = document.getElementById("postText");
const saveBtn = document.getElementById("saveBtn");
const cancelBtn = document.getElementById("cancelBtn");
const editNote = document.getElementById("edit-note");
const adminMsg = document.getElementById("admin-msg");
const photoInput = document.getElementById("photoInput");
const addPhotoBtn = document.getElementById("addPhotoBtn");
const preview = document.getElementById("preview");
const photoInfo = document.getElementById("photo-info");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");

/* show a message under the Publish button */
function say(msg, kind) {
  adminMsg.textContent = msg;
  adminMsg.className = kind || "";
}

/* give up waiting if Firebase never answers */
function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error("timeout")), ms)
    )
  ]);
}

/* switch the form between "new post" and "editing a post" */
function setEditMode(on) {
  saveBtn.textContent = on ? "Save changes" : "Publish";
  cancelBtn.style.display = on ? "inline-block" : "none";
  editNote.style.display = on ? "block" : "none";
}

/* ===== PHOTOS ===== */

function readAsDataURL(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

/* shrink a photo to max 1000px and save it as a JPEG */
async function compress(file, maxDim = 1000, quality = 0.75) {
  const url = URL.createObjectURL(file);
  let img;
  try {
    img = await loadImage(url);
  } finally {
    URL.revokeObjectURL(url);
  }

  const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
  const w = Math.round(img.width * scale);
  const h = Math.round(img.height * scale);

  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;

  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fff";            // transparent PNGs get a white background
  ctx.fillRect(0, 0, w, h);
  ctx.drawImage(img, 0, 0, w, h);

  return canvas.toDataURL("image/jpeg", quality);
}

function totalSize() {
  return pendingImages.reduce((n, s) => n + s.length, 0);
}

function renderPreview() {
  preview.innerHTML = "";

  pendingImages.forEach((src, i) => {
    const wrap = document.createElement("div");
    wrap.className = "thumb";

    const img = document.createElement("img");
    img.src = src;
    img.alt = "photo " + (i + 1);

    const x = document.createElement("button");
    x.type = "button";
    x.textContent = "\u2715";
    x.title = "remove this photo";
    x.onclick = () => {
      pendingImages.splice(i, 1);
      renderPreview();
    };

    wrap.appendChild(img);
    wrap.appendChild(x);
    preview.appendChild(wrap);
  });

  photoInfo.textContent = pendingImages.length
    ? `${pendingImages.length} photo${pendingImages.length > 1 ? "s" : ""}, ` +
      `${Math.round(totalSize() / 1000)} KB of ${LIMIT / 1000} KB`
    : "";
}

addPhotoBtn.addEventListener("click", () => photoInput.click());

photoInput.addEventListener("change", async () => {
  const files = [...photoInput.files];
  photoInput.value = "";
  if (!files.length) return;

  say("processing photos...");

  for (const file of files) {
    if (!file.type.startsWith("image/")) continue;

    try {
      const dataUrl =
        file.type === "image/gif" && file.size <= GIF_MAX_BYTES
          ? await readAsDataURL(file)
          : await compress(file);
      pendingImages.push(dataUrl);
    } catch (err) {
      console.error(err);
      say("couldn't read " + file.name, "err");
      renderPreview();
      return;
    }
  }

  renderPreview();
  say(totalSize() > LIMIT ? "too many photos for one post, remove one before publishing." : "", "err");
});

function openLightbox(src) {
  lightboxImg.src = src;
  lightbox.classList.add("open");
}

lightbox.addEventListener("click", () => lightbox.classList.remove("open"));

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") lightbox.classList.remove("open");
});

/* AUTH CHECK */
onAuthStateChanged(auth, async (user) => {
  if (user && user.uid === ADMIN_UID) {
    isAdmin = true;
    document.getElementById("admin-panel").style.display = "block";
  } else {
    isAdmin = false;
    document.getElementById("admin-panel").style.display = "none";
  }

  await loadPosts();
});

/* PUBLISH (new post) or SAVE (editing) */
window.savePost = async function () {
  if (!isAdmin) {
    say("you're not signed in as admin on this page. Sign in on the login page, then reload.", "err");
    return;
  }

  const title = titleInput.value.trim();
  const text = textInput.value.trim();

  if (!title || (!text && pendingImages.length === 0)) {
    say("add a title and some text or a photo first.", "err");
    return;
  }

  const size = totalSize() + title.length + text.length;
  if (size > LIMIT) {
    say(`this post is too big (${Math.round(size / 1000)} KB, max ${LIMIT / 1000} KB). Remove a photo and try again.`, "err");
    return;
  }

  saveBtn.disabled = true;
  say("saving...");

  try {
    const data = { title, text, images: pendingImages };

    const request = editingId
      ? updateDoc(doc(db, "posts", editingId), data)
      : addDoc(col, { ...data, date: new Date().toISOString() });

    await withTimeout(request, 30000);
  } catch (err) {
    console.error(err);

    if (err.message === "timeout") {
      say("no reply from Firebase after 30 seconds. The post may still be saving, so reload and check before trying again. Open the console (F12) for details.", "err");
    } else if (err.code === "permission-denied") {
      say("Firebase blocked the save. Add the rule for the 'posts' collection in Firestore -> Rules, then click Publish on the rules.", "err");
    } else {
      say("couldn't save: " + (err.code || err.message), "err");
    }

    saveBtn.disabled = false;
    return;
  }

  saveBtn.disabled = false;
  window.cancelEdit();
  say("saved.", "ok");
  setTimeout(() => say(""), 3000);

  await loadPosts();
};

/* CANCEL / RESET FORM */
window.cancelEdit = function () {
  editingId = null;
  titleInput.value = "";
  textInput.value = "";
  pendingImages = [];
  renderPreview();
  setEditMode(false);
};

/* LOAD */
async function loadPosts() {
  const container = document.getElementById("posts");
  const status = document.getElementById("status");

  container.innerHTML = "";
  status.textContent = "";

  let snapshot;
  try {
    snapshot = await getDocs(query(col, orderBy("date", "desc")));
  } catch (err) {
    console.error(err);
    status.textContent = "couldn't load posts (" + (err.code || err.message) + ").";
    return;
  }

  if (snapshot.empty) {
    status.textContent = "no posts yet.";
    return;
  }

  snapshot.forEach((d) => {
    const p = d.data();
    const id = d.id;

    const post = document.createElement("div");
    post.className = "post";
    post.id = `post-${id}`;

    /* everything is inserted as plain text, so nothing typed can run as code */
    const h2 = document.createElement("h2");
    h2.className = "post-title";
    h2.textContent = p.title;

    const date = document.createElement("div");
    date.className = "post-date";
    date.textContent = new Date(p.date).toLocaleDateString(undefined, {
      year: "numeric",
      month: "long",
      day: "numeric"
    });

    post.appendChild(h2);
    post.appendChild(date);

    if (p.text) {
      const text = document.createElement("div");
      text.className = "post-text";
      text.textContent = p.text;
      post.appendChild(text);
    }

    /* PHOTOS (only real image data is accepted) */
    const photos = Array.isArray(p.images)
      ? p.images.filter((s) => typeof s === "string" && s.startsWith("data:image/"))
      : [];

    if (photos.length) {
      const box = document.createElement("div");
      box.className = "post-images";

      photos.forEach((src, i) => {
        const img = document.createElement("img");
        img.src = src;
        img.alt = "photo " + (i + 1);
        img.loading = "lazy";
        img.onclick = () => openLightbox(src);
        box.appendChild(img);
      });

      post.appendChild(box);
    }

    /* ADMIN BUTTONS */
    if (isAdmin) {
      const admin = document.createElement("div");
      admin.className = "post-admin";

      const editBtn = document.createElement("button");
      editBtn.textContent = "Edit";
      editBtn.onclick = () => {
        editingId = id;
        titleInput.value = p.title;
        textInput.value = p.text || "";
        pendingImages = photos.slice();
        renderPreview();
        setEditMode(true);
        say("");
        window.scrollTo({ top: 0, behavior: "smooth" });
        textInput.focus();
      };

      const deleteBtn = document.createElement("button");
      deleteBtn.textContent = "Delete";
      deleteBtn.onclick = () => deletePost(id);

      admin.appendChild(editBtn);
      admin.appendChild(deleteBtn);
      post.appendChild(admin);
    }

    container.appendChild(post);
  });
}

/* DELETE */
async function deletePost(id) {
  if (!isAdmin) return;

  if (!confirm("Delete this post?")) return;

  try {
    await withTimeout(deleteDoc(doc(db, "posts", id)), 10000);
  } catch (err) {
    console.error(err);
    alert("Couldn't delete: " + (err.code || err.message));
    return;
  }

  if (editingId === id) window.cancelEdit();

  await loadPosts();
}
</script>

</body>
</html>
