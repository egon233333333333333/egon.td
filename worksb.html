<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background-color: #877360;
    }

    .content-container {
      max-width: 600px;
    }

    .video-container {
      width: 100%;
    }

    .responsive-iframe {
      width: 100%;
      aspect-ratio: 600 / 345;
      border: 1px solid grey;
    }
  </style>

</head>

<body>

  <div class="content-container">

    <h3>Sino si Rizal Para Sayo?</h3>

    <div class="video-container">
      <iframe
        class="responsive-iframe"
        src="https://www.youtube.com/embed/G0vjRwlnCjo"
        title="Sino si Rizal para sayo?"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

  </div>

</body>
</html>
